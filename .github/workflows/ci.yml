name: ci

on:
  push: {branches: [main, develop]}
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: what_s_price}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d what_s_price"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/what_s_price
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {enable-cache: true}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest

  build:
    needs: tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, kind]
    env:
      KIND_CLUSTER: ml-pro-sem3
    permissions: {contents: read, packages: read}
    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Образ в кластер
        run: |
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name "$KIND_CLUSTER"
      - name: Секрет базы
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          test -n "$DB_PASSWORD"
          DATABASE_URL=$(python3 -c 'import os,urllib.parse; p=urllib.parse.quote(os.environ["DB_PASSWORD"], safe=""); print(f"postgresql://postgres:{p}@postgres:5432/what_s_price")')
          kubectl create secret generic what-s-price-secrets \
            --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: База
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status deploy/postgres --timeout=180s
      - name: Сервис
        run: |
          kubectl apply -f k8s/configmap-registry.yaml -f k8s/deployment.yaml -f k8s/service.yaml -f k8s/ingress.yaml -f k8s/hpa.yaml
          kubectl set image deploy/what-s-price api="$IMAGE"
          kubectl rollout status deploy/what-s-price --timeout=180s
      - name: Smoke
        run: bash scripts/sem3-smoke.sh
      - name: Диагностика
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl get events --sort-by=.lastTimestamp | tail -40
          kubectl describe deploy/what-s-price | tail -50
          kubectl describe pods -l app=what-s-price | tail -100
          kubectl logs -l app=what-s-price --all-containers --tail=50 --prefix || true
          kubectl logs -l app=what-s-price --all-containers --previous --tail=50 --prefix || true
