apiVersion: apps/v1
kind: Deployment
metadata:
  name: what-s-price
spec:
  replicas: 2
  selector:
    matchLabels:
      app: what-s-price
  template:
    metadata:
      labels:
        app: what-s-price
    spec:
      containers:
        - name: api
          image: what-s-price:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: what-s-price-config
            - secretRef:
                name: what-s-price-secrets
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
