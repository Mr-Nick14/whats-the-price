apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: what-s-price
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: what-s-price
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
